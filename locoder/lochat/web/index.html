<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0d0d">
<title>lochat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%237c3aed'/%3E%3Crect x='8' y='7' width='7.5' height='32' rx='3.75' fill='%23fff'/%3E%3Ccircle cx='31' cy='26' r='8.5' fill='none' stroke='%23fff' stroke-width='7.5'/%3E%3Cpath d='M22.2 31.5 18.5 40.5l9.6-4.3z' fill='%23fff'/%3E%3C/svg%3E">
<!-- The font comes from Google Fonts; without internet the phone's own font is used. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #0d0d0d;
    --raise: #151515;
    --fg: #f0f0f0;
    --secondary: #a8a8a8;
    --muted: #6a6a6a;
    --faint: #3a3a3a;
    --line: #262626;
    --hover: #1b1b1b;
    --ok: #5fb85f;
    --warn: #d7a84a;
    --error: #e5534b;
    --accent: #a78bfa;
    --accent-2: #7c3aed;
    --accent-dim: #a78bfa22;
    --on-accent: #140b2e;
    --you: #231d36;
    --you-line: #3a3157;
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --r: 20px;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); font-weight: 600; }
  body { display: flex; justify-content: center; overflow: hidden; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; transition: transform .18s var(--spring), background .2s, color .2s, border-color .2s, opacity .2s; }
  button:active:not(:disabled) { transform: scale(.88); }
  button:disabled { cursor: default; }
  svg { display: block; }
  [hidden] { display: none !important; }

  #app { width: 100%; max-width: 560px; height: 100dvh; position: relative; overflow: hidden; }

  /* -- screens slide and fade between each other --------------------------- */
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top);
          transition: transform .45s var(--ease), opacity .35s var(--ease), filter .35s; }
  .view:not(.active) { opacity: 0; pointer-events: none; transform: translateX(40px) scale(.98); filter: blur(4px); }
  .view.left:not(.active) { transform: translateX(-40px) scale(.98); }
  .in { opacity: 0; transform: translateY(14px); }
  .view.active .in { animation: rise .55s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 55ms + 80ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } }

  /* -- logo ------------------------------------------------------------------- */
  .mark { width: 92px; height: 92px; border-radius: 30px; display: grid; place-items: center; background: var(--accent-2); position: relative; flex: none; }
  .mark::before { content: ""; position: absolute; inset: -14px; border-radius: 40px; border: 2px solid #a78bfa55; animation: halo 3s ease-out infinite; }
  .mark svg { width: 62px; height: 62px; }
  .mark .tail { transform-origin: 26px 33px; animation: talk 2.4s var(--spring) infinite; }
  .mark.float { animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  @keyframes halo { 0% { transform: scale(.85); opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
  @keyframes talk { 0%, 70%, 100% { transform: none; } 78% { transform: rotate(-16deg) scale(1.15); } 88% { transform: rotate(6deg); } }
  .bo { width: .74em; height: .74em; margin: 0 .03em 0 .06em; color: var(--accent); vertical-align: -.02em; display: inline-block; }

  /* -- top bar ------------------------------------------------------------------- */
  .bar { display: flex; align-items: center; gap: 4px; padding: 14px 10px 10px 18px; min-height: 66px; flex: none; }
  .bar h1 { font-size: 32px; font-weight: 800; margin: 0; flex: 1; min-width: 0; max-width: 100%; overflow: hidden; letter-spacing: -.03em; transition: opacity .25s, max-width .4s var(--ease); white-space: nowrap; }
  .bar h1 .bo { animation: wobble 4s var(--ease) infinite; transform-origin: 30% 80%; }
  @keyframes wobble { 0%, 86%, 100% { transform: none; } 90% { transform: rotate(-14deg) scale(1.15); } 95% { transform: rotate(10deg); } }
  .bar .title { flex: 1; min-width: 0; padding: 0 4px; }
  .bar .title b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .title span { font-size: 12px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  .bar.border { border-bottom: 1px solid var(--line); padding-left: 6px; }
  .iconbtn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--secondary); flex: none; }
  .iconbtn:hover { background: var(--hover); color: var(--fg); }
  .iconbtn svg { width: 22px; height: 22px; }
  .spin-hover svg { transition: transform .5s var(--spring); }
  .spin-hover:hover svg { transform: rotate(90deg); }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); position: relative; flex: none; }
  .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ping 2s ease-out infinite; }
  .dot.off { background: var(--faint); }
  .dot.off::after { animation: none; }
  @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(2.8); opacity: 0; } }
  .pc { position: relative; }
  .pc .dot { position: absolute; right: 8px; top: 9px; box-shadow: 0 0 0 2px var(--bg); }

  /* search: the icon opens into a field that takes the title's place */
  .search { display: flex; align-items: center; height: 42px; flex: 0 0 42px; min-width: 0; border-radius: 99px; overflow: hidden; transition: flex-grow .4s var(--ease), background .3s; }
  .search input { flex: 1; width: 0; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; font-weight: 600; padding: 0 14px 0 0; opacity: 0; transition: opacity .2s; }
  .search.open { flex-grow: 1; background: var(--raise); }
  .search.open input { opacity: 1; transition-delay: .15s; }
  .bar.searching h1 { max-width: 0; flex: 0; opacity: 0; }

  .banner { margin: 0 12px 6px; padding: 10px 8px 10px 14px; border-radius: 16px; border: 1px solid #4a3a1a; color: var(--warn);
            font-size: 13px; font-weight: 600; display: none; align-items: center; gap: 10px; animation: rise .4s var(--ease); }
  #app.offline .banner { display: flex; }
  .banner span { flex: 1; }
  .banner .iconbtn { width: 34px; height: 34px; color: var(--warn); }
  .banner .iconbtn svg { width: 18px; height: 18px; }

  /* -- connect ---------------------------------------------------------------------- */
  .connect { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; gap: 16px; }
  .connect h2 { margin: 6px 0 0; font-size: 52px; font-weight: 800; letter-spacing: -.045em; line-height: 1; }
  .connect p { margin: 0; color: var(--secondary); line-height: 1.45; max-width: 290px; font-weight: 500; }
  .addr { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 312px; padding: 0 14px; height: 52px; border-radius: 16px;
          border: 2px solid var(--line); background: var(--raise); color: var(--muted); transition: border-color .2s; }
  .addr:focus-within { border-color: var(--accent); }
  .addr svg { width: 20px; height: 20px; flex: none; }
  .addr input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--fg); font-size: 16px; font-weight: 600; }
  .addr input::placeholder { color: var(--muted); }
  .codebox { display: flex; gap: 8px; margin-top: 4px; }
  .codebox input { width: 44px; height: 58px; border-radius: 14px; border: 2px solid var(--line); background: var(--raise); text-align: center;
                   font-size: 26px; font-weight: 800; outline: 0; caret-color: var(--accent); transition: border-color .2s, box-shadow .2s; padding: 0; }
  .codebox input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
  .codebox input.filled { animation: pop .35s var(--spring); border-color: var(--faint); }
  .codebox.bad input { border-color: var(--error); animation: shake .4s; }
  @keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  .connect-row { display: flex; gap: 12px; margin-top: 6px; }
  .bigbtn { width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center; }
  .bigbtn svg { width: 28px; height: 28px; transition: transform .3s var(--spring); }
  .bigbtn.go { background: var(--accent); color: var(--on-accent); }
  .bigbtn.go:hover:not(:disabled) svg { transform: translateX(4px); }
  .bigbtn.go:disabled { background: var(--faint); color: var(--muted); }
  .bigbtn.go.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bigbtn.qr { border: 2px solid var(--line); color: var(--secondary); }
  .bigbtn.qr:hover { border-color: var(--accent); color: var(--accent); }
  .err { color: var(--error); font-size: 13px; font-weight: 600; max-width: 310px; line-height: 1.45; min-height: 1em; }
  .fine { font-size: 12px; color: var(--muted); max-width: 300px; line-height: 1.5; font-weight: 500; }
  .fine code { font-family: var(--mono); color: var(--secondary); }

  /* -- chat list --------------------------------------------------------------------- */
  .list { flex: 1; overflow-y: auto; padding: 0 8px 110px; }
  .group { font-size: 13px; color: var(--muted); padding: 16px 12px 6px; font-weight: 700; letter-spacing: .02em; }
  .item { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 11px 12px; border-radius: 18px;
          opacity: 0; animation: rise .5s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 40ms); transform: translateY(14px); }
  .item:hover { background: var(--hover); }
  .item:hover .avatar { transform: rotate(-8deg) scale(1.08); }
  .avatar { width: 46px; height: 46px; border-radius: 16px; flex: none; display: grid; place-items: center; background: var(--raise);
            border: 1px solid var(--line); font-size: 19px; font-weight: 800; color: var(--accent); transition: transform .35s var(--spring); }
  .item .txt { min-width: 0; flex: 1; }
  .item b { display: block; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item small { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; font-weight: 500; margin-top: 3px; }
  .item time { font-size: 12px; color: var(--muted); align-self: flex-start; margin-top: 3px; font-weight: 600; }
  .nothing { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 22vh 24px 0; color: var(--muted); font-weight: 600; text-align: center; animation: fadein .5s; }
  .nothing .mark { width: 72px; height: 72px; border-radius: 24px; }
  .nothing .mark svg { width: 48px; height: 48px; }
  .nothing .mark::before { inset: -10px; border-radius: 32px; }
  .fab { position: absolute; right: 20px; bottom: calc(26px + env(safe-area-inset-bottom)); width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center;
         background: var(--accent); color: var(--on-accent); }
  .view.active .fab { animation: fabin .6s var(--spring) .3s backwards; }
  @keyframes fabin { from { transform: scale(0) rotate(-90deg); } }
  .fab svg { width: 28px; height: 28px; transition: transform .4s var(--spring); }
  .fab:hover svg { transform: rotate(90deg); }

  /* -- one chat -------------------------------------------------------------------------- */
  .messages { flex: 1; overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 18px; overflow-anchor: none; }
  .msg { animation: msgin .45s var(--spring) backwards; }
  .msg.you { align-self: flex-end; max-width: 84%; background: var(--you); border: 1px solid var(--you-line); white-space: pre-wrap; word-wrap: break-word;
             padding: 11px 15px; border-radius: var(--r) var(--r) 6px var(--r); line-height: 1.4; font-weight: 600; transform-origin: bottom right; }
  .msg.ai { line-height: 1.55; color: var(--fg); font-weight: 500; transform-origin: top left; min-width: 0; }
  @keyframes msgin { from { opacity: 0; transform: translateY(12px) scale(.94); } }
  .answer { word-wrap: break-word; }
  .answer > :first-child { margin-top: 0; }
  .answer p { margin: 0 0 10px; }
  .answer p:last-child { margin-bottom: 0; }
  .answer b { font-weight: 800; }
  .answer ul, .answer ol { margin: 0 0 10px; padding-left: 22px; }
  .answer li { margin: 5px 0; }
  .answer li::marker { color: var(--accent); font-weight: 800; }
  .answer h4 { margin: 14px 0 6px; font-size: 17px; font-weight: 800; }
  .answer code { font-family: var(--mono); font-size: .88em; background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
  .answer pre { background: var(--raise); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; overflow-x: auto; margin: 0 0 10px; }
  .answer pre code { background: none; border: 0; padding: 0; font-size: 13px; }
  .answer.narration { color: var(--secondary); font-size: 14px; }
  .answer .table { overflow-x: auto; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 14px; }
  .answer table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .answer th, .answer td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  .answer th { font-weight: 800; color: var(--accent); background: var(--raise); white-space: nowrap; }
  .answer tr:last-child td { border-bottom: 0; }
  .answer td:first-child { font-weight: 700; }
  .answer.live > :last-child::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 5px; border-radius: 50%; background: var(--accent); animation: caret 1s infinite; vertical-align: middle; }
  @keyframes caret { 50% { opacity: .2; } }
  .think { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 8px; }
  .think-head { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .think-head i { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--accent); background: var(--accent-dim); }
  .think-head svg { width: 16px; height: 16px; }
  .think.live .think-head i svg { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.8); opacity: .6; } }
  .think .body { display: none; margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 500; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
  .think.open .body { display: block; animation: fadein .3s; }
  .pill { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; margin: 2px 0 10px; padding: 7px 12px 7px 9px; border-radius: 99px;
          border: 1px solid var(--line); color: var(--secondary); font-size: 13px; font-weight: 600; animation: rise .35s var(--spring) backwards; }
  .pill svg { width: 15px; height: 15px; flex: none; color: var(--accent); }
  .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill.pending svg { animation: spin 2s linear infinite; }
  .pill.err { color: var(--error); }
  .note { font-size: 13px; color: var(--warn); font-weight: 600; margin: 4px 0; }
  .note.error { color: var(--error); }
  .typing { display: inline-flex; gap: 6px; padding: 10px 14px; border-radius: 16px; background: var(--raise); }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: jump 1s var(--ease) infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes jump { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-6px); opacity: 1; } }
  .actions { display: flex; gap: 2px; margin-top: 6px; margin-left: -10px; animation: rise .4s var(--ease) .2s backwards; }
  .actions .iconbtn { width: 36px; height: 36px; }
  .actions svg { width: 18px; height: 18px; }
  .actions .done { color: var(--ok); }
  .actions .on { color: #f472b6; }
  .meta { font-size: 12px; color: var(--muted); font-weight: 500; align-self: center; margin-left: 6px; }
  .empty { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px; padding: 24px; }
  .empty .mark { width: 72px; height: 72px; border-radius: 24px; animation: rise .6s var(--spring) backwards, float 4s ease-in-out .6s infinite; }
  .empty .mark::before { border-radius: 32px; inset: -10px; }
  .empty .mark svg { width: 48px; height: 48px; }
  .empty h3 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.035em; text-align: center; line-height: 1.05; animation: rise .6s var(--ease) .12s backwards; }
  .empty h3 span { color: var(--accent); }

  .composer { margin: 8px 12px calc(12px + env(safe-area-inset-bottom)); border: 2px solid var(--line); border-radius: 26px; background: var(--raise);
              padding: 6px 6px 6px 8px; display: flex; align-items: flex-end; gap: 4px; transition: border-color .25s, box-shadow .25s; flex: none; }
  .composer:focus-within { border-color: #4c3d7a; box-shadow: 0 0 0 4px var(--accent-dim); }
  .composer textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: none; font-size: 16px; font-weight: 600; padding: 10px 4px; max-height: 140px; line-height: 1.35; }
  .toggle { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); position: relative; flex: none; }
  .toggle svg { width: 21px; height: 21px; transition: transform .45s var(--spring); }
  .toggle:hover { color: var(--secondary); background: var(--hover); }
  .toggle.on { color: var(--accent); background: var(--accent-dim); }
  .toggle.on svg { transform: scale(1.08); }
  #thinkBtn .rays { opacity: 0; transition: opacity .3s; }
  #thinkBtn.on .rays { opacity: 1; }
  #thinkBtn.on svg { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { transform: scale(1.08); } 50% { transform: scale(.94); } }
  #webBtn.on svg { animation: spin 6s linear infinite; }
  .toggle.flash::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: ring .5s ease-out forwards; }
  @keyframes ring { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .send { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
  .send:disabled { background: var(--faint); color: var(--muted); transform: scale(.85); }
  .send svg { width: 20px; height: 20px; }
  .send.fly svg { animation: fly .5s var(--ease); }
  .send.stop { background: var(--fg); color: var(--bg); }
  @keyframes fly { 40% { transform: translateY(-26px); opacity: 0; } 41% { transform: translateY(20px); opacity: 0; } 100% { transform: none; opacity: 1; } }

  /* -- settings ------------------------------------------------------------------------------- */
  .settings { flex: 1; overflow-y: auto; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 10px; }
  .card { border: 1px solid var(--line); border-radius: 22px; padding: 4px 6px; }
  .row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 10px; border-radius: 16px; }
  button.row:hover { background: var(--hover); }
  .row > svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
  .row .grow { flex: 1; min-width: 0; }
  .row .grow div:first-child { font-weight: 700; }
  .row .sub { color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 2px; white-space: pre-line; word-break: break-all; }
  .switch { width: 46px; height: 28px; border-radius: 99px; background: var(--faint); position: relative; flex: none; transition: background .25s; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); transition: transform .35s var(--spring); }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(18px); background: var(--on-accent); }
  .row.danger, .row.danger > svg { color: var(--error); }
  .version { color: var(--faint); font-size: 12px; text-align: center; margin-top: 8px; font-weight: 500; }

  /* -- sheet, dialog, toast --------------------------------------------------------------------- */
  #scrim { position: fixed; inset: 0; background: #000a; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 10; }
  #scrim.show { opacity: 1; pointer-events: auto; }
  #sheet { position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 560px; max-height: 70vh; overflow-y: auto; background: var(--raise);
           border: 1px solid var(--line); border-bottom: 0; border-radius: 28px 28px 0 0; padding: 10px 10px calc(16px + env(safe-area-inset-bottom));
           transform: translate(-50%, 100%); transition: transform .45s var(--ease); z-index: 11; }
  #sheet.show { transform: translate(-50%, 0); }
  #sheet::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--faint); margin: 2px auto 10px; }
  #sheetTitle { font-size: 13px; color: var(--muted); font-weight: 700; padding: 0 12px 6px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 12px; border-radius: 14px; font-weight: 600; }

<script>
/* ======================================================================
   lochat. Talks to `lochat serve` on your PC - the same API, pairing and
   end-to-end encryption as locoder serve (locoder/serve), just a chat-only
   agent behind it.

   Loaded from the PC itself (http://<pc>:8766 in a phone browser) or
   bundled in the Android app (file://), whose bridge window.LocoderAndroid

const $ = (s, el = document) => el.querySelector(s);

const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const Android = window.LocoderAndroid || null;
const IN_APP = location.protocol === "file:";
const DEFAULT_PORT = "8766";

/* ---------- icons ---------- */
const ICON = {

  bo: '<svg class="bo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12.5" cy="11.5" r="8" fill="none" stroke="currentColor" stroke-width="5"/><path d="M5.2 15.5 2.5 22.5l7.6-3.4z" fill="currentColor"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg>',

  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21.5h4M12 4a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 4z"/></svg>',
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3 2.6 15 0 18M12 3c-2.6 3-2.6 15 0 18"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m14 6 4 4"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
};
$$("[data-logo]").forEach(el => el.innerHTML = ICON.logo);
$$("[data-wordmark]").forEach(el => { el.innerHTML = "l" + ICON.bo + "chat"; el.setAttribute("aria-label", "lochat"); });
$("#sendBtn").innerHTML = ICON.send;

/* ---------- storage ---------- */
const store = {
  get(k) { try { return localStorage.getItem("lochat." + k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem("lochat." + k) : localStorage.setItem("lochat." + k, v); } catch {} },
};

/* ---------- end-to-end encryption (the protocol is in locoder/serve/e2e.py) ---------- */
const te = new TextEncoder(), td = new TextDecoder();
const CAN_E2E = !!(window.crypto && crypto.subtle);
function bytesToB64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64urlToBytes = s => b64ToBytes(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
async function hmacSha256(key, msg) {
  const k = await crypto.subtle.importKey("raw", key, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", k, msg));
}

  const d = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
  return [...d].map(b => b.toString(16).padStart(2, "0")).join("");

async function makeChannel(secret) {
  const key = async (label, use) =>
    crypto.subtle.importKey("raw", await hmacSha256(secret, te.encode(label)), "AES-GCM", false, [use]);
  return { c2s: await key("c2s", "encrypt"), s2c: await key("s2c", "decrypt") };
}
async function sealRequest(ch, sender, message, pair = false) {
  const nonce = crypto.getRandomValues(new Uint8Array(12));
  const sealed = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv: nonce, additionalData: te.encode("locoder-req:" + sender) },
    ch.c2s, te.encode(JSON.stringify(message)));
  return { envelope: { v: 1, [pair ? "pair" : "d"]: sender, n: bytesToB64(nonce), c: bytesToB64(new Uint8Array(sealed)) }, nonce };
}
async function openSealed(ch, label, nonce, env) {
  const aad = new Uint8Array([...te.encode(label), ...nonce]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(env.n), additionalData: aad },
    ch.s2c, b64ToBytes(env.c));
  return JSON.parse(td.decode(plain));
}
const e2e = {
  async forKey(key) {
    if (this.key !== key) {
      this.id = (await sha256Hex(te.encode(key))).slice(0, 32);
      this.ch = await makeChannel(await hmacSha256(te.encode("locoder e2e"), te.encode(key)));
      this.key = key;
    }
    return this;
  },
};

/* ---------- the API ----------
   "lan": your Wi-Fi, with the key in a header. "remote": the Cloudflare
   tunnel, where every request and reply is sealed end to end. */
const apiError = (message, status) => Object.assign(new Error(message), { status });
async function fetchWithTimeout(url, opts, ms = 10000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    return await fetch(url, { cache: "no-store", ...opts, signal: ctrl.signal });
  } catch {
    throw apiError("can't reach your PC", 0);
  } finally {
    clearTimeout(timer);
  }
}
const api = {
  base: IN_APP ? (store.get("server") || "") : location.origin,
  key: store.get("key"),
  remote: IN_APP ? store.get("remote") : null,
  route: "lan",
  async call(method, path, body) {
    try {
      return await this._call(method, path, body);
    } catch (e) {
      if (e.status === 0 && IN_APP && this.remote && this.key) {
        const before = this.route;
        await pickRoute(true);
        if (this.route !== before) return this._call(method, path, body);
      }
      throw e;
    }
  },
  async _call(method, path, body) {
    if (this.route === "remote") return this._sealed(method, path, body);
    const headers = {};
    if (this.key) headers.Authorization = `Bearer ${this.key}`;
    if (body !== undefined) headers["Content-Type"] = "application/json";
    const res = await fetchWithTimeout(this.base + path,
      { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 401 && path !== "/api/pair") unpaired();
      throw apiError(data.error || `error ${res.status}`, res.status);
    }
    return data;
  },
  async _sealed(method, path, body) {
    const me = await e2e.forKey(this.key);
    const { envelope, nonce } = await sealRequest(me.ch, me.id, { m: method, p: path, b: body ?? null, t: Date.now() });
    const res = await fetchWithTimeout(this.remote + "/api/e2e",
      { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(envelope) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 401) unpaired();
      throw apiError(data.error || `error ${res.status}`, res.status);
    }
    let reply;
    try {
      reply = await openSealed(me.ch, "locoder-res:", nonce, data);
    } catch {
      throw apiError("a reply from your PC didn't decrypt - the connection may have been tampered with", 502);
    }

      if (reply.s === 401) unpaired();
      throw apiError(reply.b?.error || `error ${reply.s}`, reply.s);

  get(p) { return this.call("GET", p); },
  post(p, b = {}) { return this.call("POST", p, b); },

  try { return (await fetchWithTimeout(base + "/api/hello", {}, ms)).ok; } catch { return false; }

// background whether the home one answers now. force: find out first
// (after a request or the stream failed).
function setRoute(route) {

const codeCells = Array.from({ length: 6 }, (_, i) => h("input", { inputmode: "numeric", autocomplete: "one-time-code", "aria-label": `digit ${i + 1}` }));

    $("#codebox").classList.remove("bad");

// Pairing through the tunnel, sealed with the one-time secret from the QR code.
async function pairRemote(code, link, device) {
  const secret = b64urlToBytes(link.k);
  const pid = (await sha256Hex(secret)).slice(0, 32);
  const ch = await makeChannel(secret);
  const { envelope, nonce } = await sealRequest(ch, pid, { m: "POST", p: "/api/pair", b: { code, device }, t: Date.now() }, true);
  const res = await fetchWithTimeout(link.r + "/api/e2e",
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(envelope) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw apiError(data.error || `error ${res.status}`, res.status);
  const reply = await openSealed(ch, "locoder-res:", nonce, data);
  if (reply.s !== 200) throw apiError(reply.b?.error || `error ${reply.s}`, reply.s);
  return reply.b;
}

async function pair(code, link = null) {
  if (pairing) return;
  setPairError("");
  if (IN_APP) {
    const server = normalizeServer($("#addrInput").value);
    if (!server) {
      setPairError("type your PC's address first (lochat serve shows it), or scan the QR code");
      $("#addrInput").focus();
      return;
    }
    api.base = server;
  }
  codeCells.forEach(c => c.blur());
  pairing = true;
  updatePairBtn();
  try {
    const device = Android?.deviceName?.() || (/Android/.test(navigator.userAgent) ? "Android browser" : "phone browser");
    api.route = "lan";
    let res;
    if (IN_APP && link?.k && link?.r && CAN_E2E && !await reachable(api.base)) {
      res = await pairRemote(code, link, device);  // not at home: through the tunnel
      api.route = "remote";
    } else {
      res = await api.post("/api/pair", { code, device });
    }
    if (link?.r) setRemote(link.r);
    api.key = res.key;
    store.set("key", res.key);
    store.set("server", api.base);
    Android?.setPairing?.(api.base, res.key);
    toast(`connected to ${res.computer}`);
    if (S.notify) Android?.requestPermission?.();
    await start();
  } catch (e) {
    if (e.status === 0) {
      setPairError(`can't reach ${shortAddr() || "that address"} - is lochat serve running, and is this phone on the same Wi-Fi?`);
    } else {
      $("#codebox").classList.add("bad");
      codeCells.forEach(c => { c.value = ""; c.classList.remove("filled"); });
      setTimeout(() => codeCells[0].focus(), 400);
      setPairError(e.message);
    }
  } finally {
    pairing = false;
    updatePairBtn();
  }
}

/* QR: lochat serve shows http://<pc>:8766/#pair=<code>(&k=..&r=..). A phone
   camera opens it here (and we pair at once); the app's scanner hands it to
   window.onLocoderScanned. */
function parsePairLink(text) {
  try {
    const u = new URL(String(text).trim());
    const params = new URLSearchParams(u.hash.slice(1));
    const code = params.get("pair") || "";
    if (!/^https?:$/.test(u.protocol) || !/^\d{6}$/.test(code)) return null;
    const remote = params.get("r") || "";
    return { server: u.origin, code, k: params.get("k") || "", r: /^https:\/\//.test(remote) ? remote.replace(/\/+$/, "") : "" };
  } catch { return null; }
}
function fillCode(code) {

  updatePairBtn();
}
window.onLocoderScanned = function (text) {

  $("#addrInput").value = link.server.replace(/^https?:\/\//, "");
  fillCode(link.code);

/* ======================================================================
   The live event stream (server-sent events over fetch)
   ====================================================================== */
const conn = { seq: 0, ctrl: null, running: false, backoff: 1000, lastData: 0 };
function setOnline(on) {

  ["#pcDot", "#pcDot2", "#chatDot"].forEach(s => $(s).classList.toggle("off", !on));

function stopStream() {
  conn.running = false;
  conn.ctrl?.abort();
}
async function stream() {
  if (conn.running) return;
  conn.running = true;
  while (conn.running && api.key) {
    const ctrl = conn.ctrl = new AbortController();
    try {
      const { res, decode } = await openEvents(conn.seq, ctrl.signal);
      if (res.status === 401) { conn.running = false; unpaired(); return; }
      if (!res.ok) throw new Error(`events ${res.status}`);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      conn.lastData = Date.now();
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        conn.lastData = Date.now();
        if (!S.online) { setOnline(true); conn.backoff = 1000; }
        buf += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, cut);
          buf = buf.slice(cut + 2);
          for (const line of chunk.split("\n")) {
            if (!line.startsWith("data: ")) continue;
            try { onEvent(await decode(JSON.parse(line.slice(6)))); } catch (e) { console.error(e); }
          }
        }
      }
    } catch (e) {
      if (!conn.running) return;
    }
    setOnline(false);
    await sleep(conn.backoff);
    conn.backoff = Math.min(conn.backoff * 2, 8000);
    await pickRoute(true);
  }
  conn.running = false;
}
async function openEvents(seq, signal) {
  if (api.route === "remote") {
    const me = await e2e.forKey(api.key);
    const { envelope, nonce } = await sealRequest(me.ch, me.id, { m: "GET", p: `/api/events?since=${seq}`, b: null, t: Date.now() });
    const res = await fetch(api.remote + "/api/e2e", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(envelope), signal, cache: "no-store",
    });
    return { res, decode: env => openSealed(me.ch, "locoder-evt:", nonce, env) };
  }
  const res = await fetch(`${api.base}/api/events?since=${seq}`, {
    headers: { Authorization: `Bearer ${api.key}` }, signal, cache: "no-store",
  });
  return { res, decode: async event => event };
}
// The server pings every 15s; a stream quiet for longer is dead.
setInterval(() => {

}, 5000);
function reconnectNow() {

}

/* A new tunnel address. Restarting lochat serve --tunnel gives the tunnel a
   new address; the phone's key still works, it just needs to know where the
   PC is now. Takes the address, or a whole pairing link (only its address is
   used). The new address is kept only if the PC answers there - the answer
   is sealed with this phone's key, so a wrong or fake address can't pass. */
function tunnelFrom(text) {
  const link = parsePairLink(text);

  try {
    const u = new URL(String(text).trim());
    return u.protocol === "https:" ? u.origin : "";
  } catch { return ""; }
}
async function useTunnel(url) {
  const before = { remote: api.remote, route: api.route };
  api.remote = url;
  api.route = "remote";
  try {
    applyState(await api._sealed("GET", "/api/state"));
  } catch (e) {
    api.remote = before.remote;
    api.route = before.route;
    throw e.status === 0 ? apiError("your PC isn't at that address - check the link lochat serve shows", 0) : e;
  }
  store.set("remote", url);
  setRoute("remote");
  Android?.setRemote?.(url);
  setOnline(true);
  reconnectNow();
  loadChats();
}
function relink() {

    onOk: async text => {
      const url = tunnelFrom(text);
      if (!url) return toast("that isn't a tunnel address - it starts with https://");

    } });

function onEvent(ev) {
  if (ev.seq) conn.seq = Math.max(conn.seq, ev.seq);
  switch (ev.type) {
    case "hello": setOnline(true); applyState(ev.state); return;
    case "resync": refresh(); return;
    case "state": applyState(ev.state); return;
    case "chats":
      clearTimeout(onEvent._chats);
      onEvent._chats = setTimeout(loadChats, 150);
      return;
    case "run_start": S.server.running = ev.chat; tellAndroid(); break;
    case "run_end": S.server.running = null; tellAndroid(); break;
  }
  if (view && ev.chat === view.id && ev.seq > view.seq) {
    view.seq = ev.seq;
    applyToView(ev);
  }
}

function applyState(st) {

  const s = S.server;

const DAY = 86400000;
function when(ts) {
  const d = new Date(ts * 1000), now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (d.getTime() >= today) return ["Today", d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })];
  if (d.getTime() >= today - DAY) return ["Yesterday", d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })];
  if (d.getTime() >= today - 6 * DAY) return ["This week", d.toLocaleDateString([], { weekday: "short" })];
  return ["Older", d.toLocaleDateString([], { month: "short", day: "numeric" })];
}
function initial(title) {
  const ch = [...String(title).trim()][0] || "?";
  return /\p{Extended_Pictographic}/u.test(ch) ? ch : ch.toUpperCase();
}
function typingDots() { return h("span", { class: "typing", style: "padding:3px 6px" }, h("i"), h("i"), h("i")); }
function renderList() {
  const q = $("#searchInput").value.toLowerCase();
  const chats = S.chats.filter(c => c.title.toLowerCase().includes(q));
  const list = $("#chatList");
  if (!chats.length) {
    list.replaceChildren(q ? h("div", { class: "nothing" }, "no chats match")
      : h("div", { class: "nothing" }, h("div", { class: "mark float", html: ICON.logo }), "no chats yet"));
    return;
  }
  const out = [];
  let group = null, i = 0;
  for (const c of chats) {
    const [g, time] = c.updated ? when(c.updated) : ["Older", ""];
    if (g !== group) { out.push(h("div", { class: "group" }, g)); group = g; }
    out.push(h("button", { class: "item", style: `--i:${Math.min(i++, 12)}`, onclick: () => openChat(c.id) },
      h("span", { class: "avatar" }, initial(c.title)),
      h("span", { class: "txt" }, h("b", {}, c.title),
        h("small", {}, c.running ? typingDots() : `${c.messages} message${c.messages === 1 ? "" : "s"}`)),
      h("time", {}, time)));
  }
  list.replaceChildren(...out);
}

// Markdown, the parts models use: code blocks, headings, tables, lists,

    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
  const cells = line => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  const isRule = line => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line);
  const prose = text => {
    const lines = text.split("\n"), out = [];
    let para = [];
    const flush = () => { if (para.length) out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line.trim()) { flush(); continue; }
      if (/^\s*#{1,6} /.test(line)) { flush(); out.push(`<h4>${inline(line.replace(/^\s*#+ /, ""))}</h4>`); continue; }
      if (/^\s*\|/.test(line) && i + 1 < lines.length && isRule(lines[i + 1])) {
        flush();
        const head = cells(line);
        const rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
        i--;
        out.push('<div class="table"><table><thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join("")
          + "</tr></thead><tbody>" + rows.map(r => "<tr>" + head.map((_, k) => `<td>${inline(r[k] || "")}</td>`).join("") + "</tr>").join("")
          + "</tbody></table></div>");
        continue;
      }
      const bullet = /^\s*[-*+] /.test(line), numbered = /^\s*\d+[.)] /.test(line);
      if (bullet || numbered) {
        flush();
        const items = [];
        while (i < lines.length && (bullet ? /^\s*[-*+] /.test(lines[i]) : /^\s*\d+[.)] /.test(lines[i]))) {
          items.push(`<li>${inline(lines[i].replace(bullet ? /^\s*[-*+] / : /^\s*\d+[.)] /, ""))}</li>`);
          i++;
        }
        i--;
        out.push(bullet ? `<ul>${items.join("")}</ul>` : `<ol>${items.join("")}</ol>`);
        continue;
      }
      para.push(line);
    }
    flush();
    return out.join("");
  };
  return String(src).split(/```[\w+-]*\n?/)
    .map((part, i) => i % 2 ? `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>` : prose(part)).join("");
}
function userMsg(text) { return h("div", { class: "msg you" }, text); }
function answerEl(text, narration = false) {
  const el = h("div", { class: narration ? "answer narration" : "answer", html: md(text) });
  el._raw = text;
  return el;
}
function toolPill({ verb, target, status = "ok" }) {
  return h("div", { class: `pill ${status === "ok" ? "" : status}` }, h("span", { html: ICON.globe }), h("span", {}, `${verb} ${target}`.trim()));
}
function actionsFor(turn) {
  const copy = h("button", { class: "iconbtn", title: "Copy", "aria-label": "Copy", html: ICON.copy, onclick: () => {
    const text = $$(".answer:not(.narration)", turn).map(a => a._raw || a.textContent).join("\n\n");
    copyText(text).then(() => {
      copy.innerHTML = ICON.check; copy.classList.add("done");
      setTimeout(() => { copy.innerHTML = ICON.copy; copy.classList.remove("done"); }, 1200);
    });
  } });
  const like = h("button", { class: "iconbtn", title: "Good answer", "aria-label": "Good answer", html: ICON.heart,
    onclick: () => like.classList.toggle("on") });
  return h("div", { class: "actions" }, copy, like);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return; } catch {}
  const ta = h("textarea", { style: "position:fixed;opacity:0" });
  ta.value = text;
  document.body.append(ta);
  ta.select();
  try { document.execCommand("copy"); } catch {}
  ta.remove();
}
function renderEntries(entries) {
  const out = [];
  let turn = null;
  for (const e of entries) {
    if (e.type === "user") { if (turn) turn.append(actionsFor(turn)); turn = null; out.push(userMsg(e.text)); continue; }
    if (!turn) { turn = h("div", { class: "msg ai" }); out.push(turn); }
    if (e.type === "text") turn.append(answerEl(e.text, e.narration));
    else turn.append(toolPill(e));
  }
  if (turn) turn.append(actionsFor(turn));
  if (!out.length) return renderWelcome();
  $("#messages").replaceChildren(...out);
}

/* ---------- the live answer, built from events ---------- */
function ensureTurn() {
  if (view.turn) return;
  $(".empty", $("#messages"))?.remove();
  view.turn = h("div", { class: "msg ai" });
  view.dots = typingDots();
  view.dots.style.padding = "";
  view.turn.append(view.dots);
  $("#messages").append(view.turn);
  scrollDown();
}
function addToTurn(node) {
  ensureTurn();
  view.turn.insertBefore(node, view.dots);
  if (view.dots) view.dots.hidden = true;
  scrollDown();
}
function closeThought(now = Date.now()) {
  if (!view.thought) return;
  const secs = Math.max(0, now - view.thoughtStart) / 1000;
  view.thought.classList.remove("live");
  $(".label", view.thought).textContent = `${secs.toFixed(1)}s`;
  view.thought = null;
  view.thoughtBuf = "";
}
function applyToView(ev, replay = false) {
  const at = ev.t ? ev.t * 1000 : Date.now();
  switch (ev.type) {
    case "run_start":
      if (!replay && !view.userShown) { $(".empty", $("#messages"))?.remove(); $("#messages").append(userMsg(ev.text)); }
      view.userShown = false;
      ensureTurn();
      setRunning(true);
      return;
    case "thinking":
      if (!view.thought) {
        view.thoughtStart = at;
        const el = h("div", { class: "think live" },
          h("button", { class: "think-head", "aria-label": "show the thinking" }, h("i", { html: ICON.bulb }), h("span", { class: "label" }, "")),
          h("div", { class: "body" }));
        el.firstChild.addEventListener("click", () => el.classList.toggle("open"));
        view.thought = el;
        addToTurn(el);
      }
      view.thoughtBuf += ev.text;
      $(".body", view.thought).textContent = view.thoughtBuf;
      return;
    case "token":
      closeThought(at);
      if (!view.text) {
        view.text = h("div", { class: "answer live" });
        view.textBuf = "";
        addToTurn(view.text);
      }
      view.textBuf += ev.text;
      view.text._raw = view.textBuf;
      if (replay) view.text.innerHTML = md(view.textBuf);
      else if (!view._raf) {
        view._raf = requestAnimationFrame(() => {
          view._raf = null;
          if (view.text) { view.text.innerHTML = md(view.textBuf); scrollDown(); }
        });
      }
      return;
    case "end_stream":
      closeThought(at);
      if (view.text) {
        view.text.innerHTML = md(view.textBuf);
        view.text.classList.remove("live");
        view.lastText = view.text;
      }
      view.text = null;
      if (view.dots) view.dots.hidden = false;
      return;
    case "tool_call":
      view.lastText?.classList.add("narration");
      view.lastText = null;
      view.pendingTool = toolPill({ verb: ev.verb, target: ev.target, status: "pending" });
      addToTurn(view.pendingTool);
      if (view.dots) view.dots.hidden = false;
      return;
    case "tool_result": {
      const done = toolPill(ev.entry);
      if (view.pendingTool?.isConnected) view.pendingTool.replaceWith(done); else addToTurn(done);
      view.pendingTool = null;
      return;
    }
    case "note":
      addToTurn(h("div", { class: `note ${ev.level}` }, ev.text));
      return;
    case "title":  // the model named the chat, before answering
      $("#chatTitle").textContent = view.title = ev.title;
      $("#chatTitle").animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }],
        { duration: 400, easing: "ease-out" });
      return;
    case "run_end": {
      closeThought(at);
      view.dots?.remove();
      view.dots = null;
      if (view.text) { view.text.innerHTML = md(view.textBuf); view.text.classList.remove("live"); }
      if (view.turn) {
        if (ev.status === "stopped" || ev.status === "error")
          view.turn.append(h("div", { class: "note" }, ev.status === "stopped" ? "stopped" : "something went wrong"));
        view.turn.append(actionsFor(view.turn));
      }
      view.turn = view.text = view.lastText = view.pendingTool = view.thought = null;
      if (ev.title) $("#chatTitle").textContent = view.title = ev.title;
      setRunning(false);
      scrollDown();
      return;
    }
  }
}

/* ---------- composer ---------- */
const prompt = $("#prompt");
prompt.addEventListener("input", () => {
  prompt.style.height = "auto";
  prompt.style.height = Math.min(prompt.scrollHeight, 140) + "px";
  updateSend();
});
prompt.addEventListener("keydown", e => {
  // Enter sends on a hardware keyboard; phones keep Enter for new lines.
  if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer: fine)").matches) { e.preventDefault(); send(); }
});
let runningHere = false, sending = false;
function setRunning(on) {
  runningHere = on;
  const btn = $("#sendBtn");
  btn.classList.toggle("stop", on);
  btn.innerHTML = on ? ICON.stop : ICON.send;
  btn.setAttribute("aria-label", on ? "Stop" : "Send");
  btn.title = on ? "Stop" : "Send";
  updateSend();
}
function updateSend() {
  const btn = $("#sendBtn");
  btn.disabled = runningHere ? false : (!prompt.value.trim() || sending);
}
$("#sendBtn").addEventListener("click", () => runningHere ? stop() : send());
async function send() {
  const text = prompt.value.trim();
  if (!text || sending || runningHere) return;
  if (S.server?.running && S.server.running !== view.id) return toast("busy with another chat - wait or stop it first");
  sending = true;
  updateSend();
  const btn = $("#sendBtn");
  btn.classList.remove("fly"); void btn.offsetWidth; btn.classList.add("fly");
  try {
    if (view.id) {
      $(".empty", $("#messages"))?.remove();
      $("#messages").append(userMsg(text));
      view.userShown = true;
      scrollDown(true);
      await api.post(`/api/chats/${view.id}/messages`, { text });
    } else {
      const res = await api.post("/api/chats", { text });
      await openChat(res.id);
    }
    prompt.value = "";
    prompt.style.height = "auto";
  } catch (e) {
    if (view.userShown) { $("#messages").lastChild?.remove(); view.userShown = false; }
    fail(e);
  } finally {
    sending = false;
    updateSend();
  }
}
async function stop() {
  if (!view?.id) return;
  try { await api.post(`/api/chats/${view.id}/stop`); } catch (e) { fail(e); }
}

/* ---------- think, web, model, notifications, unpair ---------- */
function flash(btn) { btn.classList.remove("flash"); void btn.offsetWidth; btn.classList.add("flash"); }
function toggleThink() {
  const on = S.server?.think === false;
  if (on) flash($("#thinkBtn"));
  api.patch("/api/state", { think: on }).then(st => {
    applyState(st);
    toast(on ? "think on - slower, more careful" : "think off - faster answers");
  }).catch(fail);
}
function toggleWeb() {
  const on = S.server?.web !== true;
  if (on) flash($("#webBtn"));
  api.patch("/api/state", { web: on }).then(st => {
    applyState(st);
    toast(on ? "web on - it can search the web" : "web off");
  }).catch(fail);
}
$("#thinkBtn").addEventListener("click", toggleThink);
$("#thinkRow").addEventListener("click", toggleThink);
$("#webBtn").addEventListener("click", toggleWeb);
$("#webRow").addEventListener("click", toggleWeb);
$("#modelRow").addEventListener("click", async () => {
  let res;
  try { res = await api.get("/api/models"); } catch (e) { return fail(e); }
  openSheet(`models on ${S.server.computer}`, res.models.length ? res.models.map(name =>
    h("button", { class: "opt", onclick: async () => {
      closeOverlays();
      try { applyState(await api.patch("/api/state", { model: name })); toast(`using ${name}`); } catch (e) { fail(e); }
    } }, h("span", { class: "grow" }, name), name === res.current ? h("span", { class: "check", html: ICON.check }) : null))
    : [h("div", { class: "opt" }, "no models found - install one on your PC: ollama pull qwen3.5:4b")]);
});
if (Android?.setNotify) {
  $("#notifyRow").hidden = false;
  $("#notifySwitch").classList.toggle("on", S.notify);
  $("#notifyRow").addEventListener("click", () => {
    S.notify = !S.notify;
    store.set("notify", S.notify ? "on" : "off");
    $("#notifySwitch").classList.toggle("on", S.notify);
    Android.setNotify(S.notify);
    if (S.notify) Android.requestPermission?.();
  });
}
$("#unpairBtn").addEventListener("click", () => dialog({
  title: "Unpair this phone?", text: "You'll need a new code from lochat serve to connect again.", danger: true,
  onOk: async () => { try { await api.post("/api/unpair"); } catch {} unpaired(); },
}));

/* ---------- Android hooks ---------- */
window.onAndroidBack = function () {
  if ($("#sheet").classList.contains("show") || $("#dialog").classList.contains("show")) { closeOverlays(); return true; }
  if (current() === "chat" || current() === "settings") { show("list"); loadChats(); return true; }
  return false;
};
// Tapping a notification opens its chat.
window.locoderOpenChat = function (id) { if (api.key && id) openChat(id); };

/* ---------- go ---------- */
const opened = IN_APP ? null : parsePairLink(location.href);
if (opened) {
  // Opened from the QR code: pair at once. The code leaves the address bar
  // so a reload or bookmark doesn't try it again.
  history.replaceState(null, "", location.pathname);
  if (api.key) start(); else { showPair(); fillCode(opened.code); pair(opened.code); }
} else if (api.key && api.base) start(); else showPair();
</script>
